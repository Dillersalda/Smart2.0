<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartblin 2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/resposive.css">
</head>
<body>
    <header class="header">
        <a href="#" class="logo">
            <img src="assets/images/logo-smartblin.png" alt="Smartblin">
        </a>

        <button class="menu-btn" aria-label="Abrir menu">
            ☰
        </button>

        <nav class="menu-mobile">
            
            <div class="menu-topo">
                <img src="assets/images/logo-smartblin.png" alt="Smartblin">
                <button class="fechar-menu" aria-label="Fechar menu">
                    ✕
                </button>
            </div>

            <div class="menu-links">
                <a href="#">Início</a>
                <a href="#">Produtos</a>
                <a href="#">Lojas</a>
                <a href="#">Assistência</a>
                <a href="#">Suporte</a>
                <a href="#">Sobre Nós</a>
            </div>
        </nav>

        <div class="menu-overlay"></div>
    </header>
    <main>
        <section class="hero">
            <div class="hero-overlay"></div>
            <div class="hero-conteudo">
                <h1>Conectando você <span>ao novo.</span></h1>
                <p>Scooter • Smartphones<br>
                Acessórios • Assistência Tecnica</p>
                <a href="#produtos" class="btn-hero">
                    Conheça nossos produtos
                    <span>→</span>
                </a>
            </div>
            <div class="descubra-mais">
                <span>⌄</span>
                <p>Descubra mais</p>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
