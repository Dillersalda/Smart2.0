<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartblin 2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/resposive.css">
</head>
<body>
    <header class="header">
        <a href="#" class="logo">
            <img src="assets/images/logo-smartblin.png" alt="Smartblin">
        </a>

        <button class="menu-btn" aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="menu-mobile">
          <div class="menu-topo">
            <img src="assets/images/logo-smartblin.png" alt="Smartblin">
            <button class="fechar-menu" aria-label="Fechar menu">✕</button>
          </div>

          <div class="menu-divisor"></div>

          <div class="menu-links">

            <a href="#" class="ativo">
            <span class="icone-menu">⌂</span>
            <span>Início</span>
            </a>

            <a href="#produtos">
            <span class="icone-menu">▣</span>
            <span>Produtos</span>
            </a>

            <a href="#lojas">
            <span class="icone-menu">⌖</span>
            <span>Lojas</span>
            </a>

            <a href="#assistencia">
            <span class="icone-menu">⚒</span>
            <span>Assistência</span>
            </a>

            <a href="#suporte">
            <span class="icone-menu">◉</span>
            <span>Suporte</span>
            </a>

            <a href="#sobre">
            <span class="icone-menu">ⓘ</span>
            <span>Sobre nós</span>
            </a>

          </div>
          
        </nav>

        <div class="menu-overlay"></div>
    </header>
    <main>
        <section class="hero">
            <div class="hero-overlay"></div>
            <div class="hero-conteudo">
                <h1>Conectando você <span>ao novo.</span></h1>
                <p>Scooter • Smartphones<br>
                Acessórios • Assistência Tecnica</p>
                <a href="#produtos" class="btn-hero">
                    Conheça nossos produtos
                    <span>→</span>
                </a>
            </div>
            <div class="descubra-mais">
                <span>⌄</span>
                <p>Descubra mais</p>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
